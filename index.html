function mediaActive(id,data){return states[id].data===data}
function save(id,notify=false){const s=states[id];try{localStorage.setItem('wellcee-v2-'+id,JSON.stringify({data:s.data}));s.saveError=false;if(notify)toast('已保存在当前浏览器')}catch(e){s.saveError=true;if(notify)toast('草稿空间不足，请减少照片后保存')}const label=$(`#${id} .draft-status`);if(label)label.textContent=s.saveError?'草稿保存失败':'草稿已保存'}
function field(id,key,label,placeholder='点击输入',opts={}){const d=states[id].data;return `<div class="form-row" data-field="${key}"><label for="${id}-${key}">${label}${opts.unit?`<span class="unit">${opts.unit}</span>`:''}${opts.required?'<span class="required">必填</span>':''}${opts.optional?'<span class="required">选填</span>':''}</label><input class="${opts.box?'fieldbox':'row-input'} ${opts.type==='date'?'date':''}" data-bind="${key}" id="${id}-${key}" value="${esc(d[key])}" placeholder="${esc(placeholder)}" type="${opts.type||'text'}" ${opts.type==='number'?'step="any" inputmode="decimal"':''} ${opts.type==='date'?`min="${today()}"`:''} ${opts.maxlength?`maxlength="${opts.maxlength}"`:''} ${opts.required?'aria-required="true"':''}></div>`}
function chip(id,key,value,label=value){const d=states[id].data;return `<button type="button" class="chip ${d[key]===value?'selected':''}" data-choice="${key}" data-value="${esc(value)}" aria-pressed="${d[key]===value}">${esc(label)}</button>`}
function typeOptions(id){const d=states[id].data;return `<div class="type-options ${id==='revised'?'compact':''}">${[['entire','整租','我要出租整套房子'],['shared','合租','只出租其中一个房间']].map(([value,label,sub])=>`<button class="type-option ${d.type===value?'selected':''}" data-choice="type" data-value="${value}" aria-pressed="${d.type===value}"><span><strong>${label}</strong><small>${sub}</small></span><span class="radio"></span></button>`).join('')}</div>`}
function layoutRow(id){const d=states[id].data;return `<div class="form-row" data-field="layout"><span class="row-label">户型${id==='revised'?'<span class="required">必填</span>':''}</span><button class="row-control" data-sheet="layout" aria-label="选择户型"><span class="${d.layoutSet?'filled':''}">${d.layoutSet?`${d.rooms}室${d.halls}厅${d.baths}卫`:'点击选择'}</span>${icon('arrow','arrow')}</button></div>`}
function locationSection(id){const d=states[id].data;return `<section class="section" data-section="location"><h2>位置${id==='revised'?'<span class="required">必填</span>':''}</h2><div class="location"><button class="city ${d.city?'filled':''}" data-sheet="city">${esc(d.city||'城市')}⌄</button><span class="loc-sep"></span><button class="address ${d.address?'filled':''}" data-sheet="address">${esc(d.address||'点击选择位置')}</button></div>${id==='revised'?'<div class="section-hint" style="margin-bottom:0">公开展示小区位置，无需填写具体门牌号。</div>':''}</section>`}
function profileOriginal(id){const d=states[id].data;return `<div class="form-row avatar-row"><span class="row-label">头像</span><button class="avatar-control" data-sheet="avatar" aria-label="选择头像">${d.avatar?`<img class="avatar" src="${esc(d.avatar)}" alt="头像">`:`<span class="avatar">${icon('user')}</span>`}</button></div>${field(id,'nickname','昵称','流芳百世的代号…',{maxlength:30})}${field(id,'job','职业','科学的讨饭方式',{maxlength:40})}<div class="form-row"><span class="row-label">性别</span><div class="chipset">${chip(id,'gender','男','♂ 男')}${chip(id,'gender','女','♀ 女')}</div></div>`}
function housing(id){const d=states[id].data,r=id==='revised';return `<div class="${r?'section':'section'}" data-section="house"><h2>出租类型${r?'<span class="required">必填</span>':''}</h2>${typeOptions(id)}</div>${r?`<div class="form-row"><span class="row-label">发布身份</span><div class="chipset">${chip(id,'role','个人转租')}${chip(id,'role','房东直租')}</div></div>${locationSection(id)}`:''}${layoutRow(id)}${field(id,'area',r?(d.type==='shared'?'房间面积':'面积'):'面积',r?(d.type==='shared'?'出租房间面积':'整套房屋面积'):'全屋面积噢',{type:'number',unit:'m²',box:true,required:r})}${field(id,'floor','楼层','点击输入',{box:true,type:'number',optional:r})}${!r?'<div class="gap"></div>'+locationSection(id):''}`}
function photosSection(id){const d=states[id].data;return `<section class="section" data-section="photos"><div class="section-title"><h2>房间照片 <small>（3-20张）</small>${id==='revised'?'<span class="required">必填</span>':''}</h2></div><div class="section-hint">*请确保上传照片清晰、真实，相同照片不能上传第二次</div><div class="photos">${d.photos.map((p,i)=>`<div class="photo"><img src="${esc(p.src)}" alt="${esc(p.name)}" data-cover="${i}" tabindex="0"><button class="remove" data-remove="${i}" aria-label="移除第${i+1}张照片">×</button><span class="caption">${i===0?(p.sample?'封面·样图':'封面'):p.sample?'样图':i+1}</span></div>`).join('')}${d.photos.length<20?`<button class="photo add" data-action="upload" aria-label="添加房间照片">${icon('image')}</button>`:''}</div><input class="file-input" id="${id}-upload" data-files="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>${id==='revised'&&d.photos.length?'<div class="section-hint" style="margin-bottom:0">点击照片可设为封面。</div>':''}</section>`}
function videoSection(id){const state=states[id],d=state.data;return `<section class="section" data-section="video"><div class="section-title"><h2 style="font-weight:400;font-size:3.7cqw">视频 <small>（可选，不超过300秒）</small></h2></div>${state.video?`<div class="video-box"><video src="${esc(state.video.url)}" controls></video><div class="file-line"><span>${esc(state.video.name)}</span><button data-action="removeVideo">移除</button></div></div>`:d.videoNeedsReupload?`<div class="video-restore-note"><strong>视频需要重新选择</strong><span>${esc(d.videoDraftName)}</span><p>文字与照片已恢复，浏览器没有保留视频文件。</p><div><button data-action="video">重新选择视频</button><button data-action="removeVideo">本次不带视频</button></div></div>`:`<button class="video-add" data-action="video" aria-label="添加视频">${icon('video')}</button>`}<input class="file-input" data-files="video" id="${id}-video" type="file" accept="video/mp4,video/quicktime,video/webm"></section>`}
function descriptionSection(id){const d=states[id].data,r=id==='revised';return `<section class="section" data-section="description"><div class="section-title"><h2>房源描述${r?'<span class="required">选填</span>':''}</h2>${r?'<button data-action="generate">根据已填信息整理</button>':''}</div><textarea class="text-area" data-bind="description" id="${id}-description" maxlength="2046" placeholder="${r?'可以补充采光、交通、其他费用，以及入住要求。只写你确定的信息。':'一分钱一分货，能配得上房源定价的描述你可得好好写～'}" aria-label="房源描述">${esc(d.description)}</textarea><div class="counter"><span data-count="description">${d.description.length}</span>/2046</div>${r?descriptionNotice(id):''}</section>`}
function introSection(id){const d=states[id].data;return `<section class="section"><h2>个人描述</h2><textarea class="text-area" data-bind="intro" id="${id}-intro" maxlength="200" placeholder="让你和你的房源在Wellcee脱颖而出！" aria-label="个人描述">${esc(d.intro)}</textarea><div class="counter"><span data-count="intro">${d.intro.length}</span>/200</div></section>`}
function availableSection(id){const d=states[id].data;return `<section class="section arrival-section" data-section="availableMode"><h2>可入住时间<span class="required">必填</span></h2><div class="chipset">${chip(id,'availableMode','now','随时入住')}${chip(id,'availableMode','date','指定日期')}${chip(id,'availableMode','flexible','可协商')}</div></section>${d.availableMode==='date'?field(id,'available','可入住日期','',{type:'date',required:true}):''}`}
function termSection(id){const d=states[id].data,r=id==='revised';return `<div data-section="terms">${r?'<section class="section" style="padding-bottom:0"><div class="section-kicker"><strong>租赁条件</strong></div></section>':''}${r?field(id,'rent','月租金','点击输入',{type:'number',box:true,unit:'RMB',required:true})+field(id,'deposit','押金','无押金请填0',{type:'number',box:true,unit:'RMB',required:true}):''}<section class="section term-section"><h2>租期${r?'<span class="required">必填</span>':''}</h2><div class="chipset">${chip(id,'term','租期不限')}${chip(id,'term','短租')}${chip(id,'term','长租')}</div></section>${r?`${availableSection(id)}${d.term==='长租'?`<div class="form-row"><span class="row-label">最短起租</span><button class="row-control" data-sheet="minMonths"><span class="filled">${d.minMonths?esc(d.minMonths)+'个月':'可协商'}</span>${icon('arrow','arrow')}</button></div>`:''}${d.term==='短租'?field(id,'endDate','最晚退租日期','',{type:'date',required:true}):''}${d.type==='shared'?`<div class="form-row" data-field="roommates"><span class="row-label">现有室友<span class="required">选填</span></span><button class="row-control" data-sheet="roommates"><span class="${d.roommates!==''?'filled':''}">${d.roommates!==''?esc(d.roommates)+'人':'点击选择'}</span>${icon('arrow','arrow')}</button></div>`:''}`:`${field(id,'rent','月租金','点击输入',{type:'number',box:true,unit:'RMB'})}${field(id,'deposit','押金','点击输入',{type:'number',box:true,unit:'RMB'})}`} ${!r||d.term==='短租'?`<div class="form-row"><span class="row-label">日租金<span class="unit">RMB</span><span style="display:block;font-size:2.7cqw;color:#aaa;font-weight:400;margin-top:1.3cqw">民宿/短租可选</span></span><input class="fieldbox" data-bind="daily" id="${id}-daily" aria-label="日租金（选填）" type="number" inputmode="decimal" value="${esc(d.daily)}" placeholder="非必填"></div>`:''}</div>`}
function tagSection(id){const d=states[id].data;const suggestions=['LGBTQ友好','宠物友好','市井烟火气','彩色多巴胺','榫卯木调'];const all=[...new Set([...suggestions,...d.tags])];return `<section class="section"><h2>房源标签${id==='revised'?'<span class="required">选填</span>':''}</h2><div class="chipset tag-chips">${all.map(v=>`<button class="chip ${d.tags.includes(v)?'selected':''}" data-tag="${esc(v)}" aria-pressed="${d.tags.includes(v)}">${esc(v)}</button>`).join('')}<button class="add-tag" data-sheet="tag" aria-label="新增房源标签">＋</button></div></section>`}
function facilitySection(id){const d=states[id].data;return `<section class="section" data-section="facilities"><h2>房屋设施${id==='revised'?'<span class="required">选填</span>':''}</h2><div class="facility-grid">${facilityList.map(([label,i])=>`<button class="facility ${d.facilities.includes(label)?'selected':''}" data-facility="${label}" aria-pressed="${d.facilities.includes(label)}">${icon(i)}<span>${label}</span></button>`).join('')}</div></section>`}
function accountSection(id){const d=states[id].data;return `<div class="section" style="padding-bottom:4cqw"><div class="account-strip"><span class="account-mini">${d.avatar?`<img src="${esc(d.avatar)}" alt="头像" style="width:100%;height:100%;border-radius:1.5cqw;object-fit:cover">`:icon('user')}</span><div><strong>${esc(d.nickname||'无')}</strong><small>个人资料</small></div><button class="account-edit" data-sheet="profile">查看${icon('arrow','arrow')}</button></div></div><details class="profile-details"><summary><span>个人描述</span><small>选填${icon('arrow','arrow')}</small></summary><div class="section"><textarea class="text-area" data-bind="intro" id="${id}-intro" maxlength="200" placeholder="可以介绍你的生活习惯，或对未来室友的期待。" aria-label="个人描述">${esc(d.intro)}</textarea><div class="counter"><span data-count="intro">${d.intro.length}</span>/200</div></div></details>`}
function endSection(id){return `<div class="gap"></div><button class="rules" data-action="rules">发布须知</button>`}
function render(id,keepScroll=true){const s=states[id],d=s.data,root=$('#'+id),top=root.querySelector('.appscroll')?.scrollTop||0;let content='';if(s.home){content=draftHome(id)}else if(s.success){content=`<div class="success"><div class="success-icon">${icon('check')}</div><h2>房源发布成功</h2><p>${esc(d.address)} · ${d.type==='shared'?'合租':'整租'}<br>¥ ${esc(d.rent)} / 月</p><button data-action="editPublished">查看并修改</button><button data-action="new">发布另一套房源</button></div>`}else if(s.preview){content=preview(id)}else if(id==='original'){content=profileOriginal(id)+'<div class="gap"></div>'+housing(id)+photosSection(id)+videoSection(id)+descriptionSection(id)+introSection(id)+'<div class="gap"></div>'+termSection(id)+tagSection(id)+facilitySection(id)+endSection(id)}else{content=housing(id)+'<div class="gap"></div>'+termSection(id)+'<div class="gap"></div>'+photosSection(id)+videoSection(id)+descriptionSection(id)+tagSection(id)+facilitySection(id)+'<div class="gap"></div>'+accountSection(id)+endSection(id)}root.innerHTML=`<div class="appnav"><button class="navback" data-action="back" aria-label="${s.preview?'返回编辑':s.home?'房源发布':'返回'}">${icon('back')}</button><h1>${s.success?'发布完成':s.preview?'房源预览':s.home?'发布房源':'房源详情'}</h1>${id==='revised'&&!s.success&&!s.home?'<button class="navsave" data-action="save">存草稿</button>':''}</div>${id==='revised'&&!s.preview&&!s.success&&!s.home?'<nav class="quicknav" aria-label="表单分组"><button data-jump="house" class="active">房屋信息</button><button data-jump="terms">租赁条件</button><button data-jump="photos">房间照片</button><button data-jump="description">房源描述</button></nav>':''}<div class="appscroll ${s.preview?'has-preview':''}">${s.pending?'<div class="draft-strip"><span>有一份上次未完成的房源</span><button data-action="restore">继续填写</button><button data-action="discardPending">放弃</button></div>':''}<div class="error hidden" role="alert"></div><div class="app-content">${content}</div></div>${!s.success&&!s.home?`<div class="appfooter">${id==='revised'?`<div class="footerline"><span class="draft-status">${s.dirty?(s.saveError?'草稿保存失败':'草稿已保存'):'自动保存草稿'}</span></div>`:''}<button class="cta" data-action="submit" ${s.mediaBusy?'disabled aria-busy="true"':''}>${s.mediaBusy?'正在处理图片 / 视频…':id==='original'?'发布':s.preview?'确认发布':'预览并发布'}</button></div>`:''}`;bind(id);if(id==='original'){root.querySelectorAll('input,textarea,button').forEach(e=>{e.disabled=true;e.tabIndex=-1});root.setAttribute('aria-label','原流程只读参考')}if(keepScroll)root.querySelector('.appscroll').scrollTop=top}
function preview(id){const d=states[id].data,s=states[id];return `<div class="preview-media"><img src="${esc(d.photos[0]?.src)}" alt="房源封面"><div><img src="${esc(d.photos[1]?.src)}" alt="房间照片二"><img src="${esc(d.photos[2]?.src)}" alt="房间照片三"></div></div><button class="preview-more" data-sheet="gallery">查看全部 ${d.photos.length} 张照片 ${icon('arrow','arrow')}</button>${s.video?`<section class="section preview-video"><h2>房源视频</h2><video src="${esc(s.video.url)}" controls preload="metadata" aria-label="房源视频预览"></video></section>`:''}<div class="preview-heading"><div class="preview-price">${esc(d.rent)} <small>RMB/月</small></div><h2>${esc(d.city)} · ${esc(d.address)}</h2><p>${esc(d.district)}　${d.type==='shared'?'合租':'整租'}　${esc(d.role)}</p>${d.tags.length?`<div class="preview-tags">${d.tags.map(esc).join(' · ')}</div>`:''}</div><section class="section"><div class="section-title"><h2>房屋信息</h2><button class="editlink" data-edit="house">修改</button></div><div class="summary-grid">${spec('户型',`${d.rooms}室${d.halls}厅${d.baths}卫`)}${spec(d.type==='shared'?'房间面积':'面积',d.area+'m²')}${d.floor?spec('楼层',d.floor+'层'):''}${d.type==='shared'&&d.roommates!==''?spec('现有室友',d.roommates+'人'):''}</div></section><section class="section"><div class="section-title"><h2>租赁条件</h2><button class="editlink" data-edit="terms">修改</button></div><div class="summary-grid">${spec('月租金',d.rent+'元')}${spec('押金',d.deposit+'元')}${spec('可入住',availableText(d))}${spec('租期',termText(d))}${d.term==='短租'&&d.daily?spec('日租金',d.daily+'元'):''}</div></section><section class="section">${d.description.trim()||d.facilities.length?`<div class="section-title"><h2>${d.description.trim()?'房源描述':'房屋设施'}</h2><button class="editlink" data-edit="${d.description.trim()?'description':'facilities'}">修改</button></div>`:''}${descriptionNotice(id)}${d.description.trim()?`<p class="preview-desc">${esc(d.description)}</p>`:''}${d.facilities.length?`<div class="chipset tag-chips">${d.facilities.map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div>`:''}${d.intro?`<p class="preview-desc">关于发布者：${esc(d.intro)}</p>`:''}<div class="preview-publisher"><span class="account-mini">${d.avatar?`<img src="${esc(d.avatar)}" alt="发布者头像">`:icon('user')}</span><span>${esc(d.nickname||'无')}<small>${esc(d.job||d.role)}</small></span><button class="editlink" data-sheet="profile">修改资料</button></div><label class="checkline"><input type="checkbox" data-confirm ${d.confirmed?'checked':''}><span>我已确认房源信息、照片真实准确，并拥有出租或转租权限。</span></label></section><div class="footnotes">小区位置公开展示，具体门牌不公开。</div>`}
function spec(label,text){return `<div><small>${label}</small><b>${esc(text)}</b></div>`}
function termText(d){return d.term==='长租'?(d.minMonths?`长租 · ${d.minMonths}个月起`:'长租 · 时长可协商'):d.term==='短租'?`短租 · 至${d.endDate}`:'租期不限'}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function bind(id){const root=$('#'+id),s=states[id],d=s.data;root.querySelectorAll('[data-bind]').forEach(el=>el.oninput=()=>{if(s.pending){s.pending=null;root.querySelector('.draft-strip')?.remove()}d[el.dataset.bind]=el.value;touch(id,el.dataset.bind);el.classList.remove('invalid');root.querySelector('.error')?.classList.add('hidden');const c=root.querySelector(`[data-count="${el.dataset.bind}"]`);if(c)c.textContent=el.value.length});root.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{const key=el.dataset.choice,value=el.dataset.value;if(id==='revised'&&key==='type'&&d.type&&d.type!==value&&d.area){phoneConfirm(id,'更换出租类型？','房间面积与整套面积含义不同，更换后需要重新填写面积。',()=>{d.type=value;d.area='';touch(id,key);render(id)},'更换',()=>closeSheet(id),'保留');return}d[key]=value;touch(id,key);render(id)});root.querySelectorAll('[data-sheet]').forEach(el=>el.onclick=()=>openSheet(id,el.dataset.sheet));root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(id,el.dataset.action));root.querySelectorAll('[data-facility]').forEach(el=>el.onclick=()=>{const v=el.dataset.facility;d.facilities=d.facilities.includes(v)?d.facilities.filter(x=>x!==v):[...d.facilities,v];touch(id,'facilities');render(id)});root.querySelectorAll('[data-tag]').forEach(el=>el.onclick=()=>{const v=el.dataset.tag;d.tags=d.tags.includes(v)?d.tags.filter(x=>x!==v):[...d.tags,v];touch(id,'tags');render(id)});root.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{d.photos.splice(+el.dataset.remove,1);touch(id,'photos');render(id)});root.querySelectorAll('[data-cover]').forEach(el=>{const choose=()=>{const i=+el.dataset.cover;if(i){d.photos.unshift(d.photos.splice(i,1)[0]);touch(id,'photos');render(id);toast('已设为封面')}};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter')choose()}});root.querySelectorAll('[data-files]').forEach(el=>el.onchange=()=>el.dataset.files==='photos'?uploadPhotos(id,el.files):uploadVideo(id,el.files?.[0]));root.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>jump(id,el.dataset.jump));root.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{s.preview=false;d.confirmed=false;render(id,false);jump(id,el.dataset.edit)});const c=root.querySelector('[data-confirm]');if(c)c.onchange=()=>{d.confirmed=c.checked;save(id)};if(id==='revised'&&!s.preview&&!s.success&&!s.home){root.querySelector('.appscroll').onscroll=()=>{const sections=['house','terms','photos','description'];let current='house';const scrollTop=root.querySelector('.appscroll').getBoundingClientRect().top;sections.forEach(name=>{const e=root.querySelector(`[data-section="${name}"]`);if(e&&e.getBoundingClientRect().top-scrollTop<75)current=name});root.querySelectorAll('[data-jump]').forEach(b=>b.classList.toggle('active',b.dataset.jump===current))}}}
function jump(id,name){const root=$('#'+id),target=root.querySelector(`[data-section="${name}"]`);if(target)root.querySelector('.appscroll').scrollTo({top:target.offsetTop,behavior:'smooth'})}
function action(id,type){const s=states[id],d=s.data;if(s.mediaBusy&&['upload','video','samplePhotos','submit'].includes(type)){toast('图片或视频正在处理中，请稍候');return}if(type==='upload')return $(`#${id}-upload`).click();if(type==='video')return $(`#${id}-video`).click();if(type==='removeVideo'){if(s.video)URL.revokeObjectURL(s.video.url);s.video=null;d.videoDraftName='';d.videoNeedsReupload=false;touch(id,'video');render(id);return}if(type==='reviewDescription'){d.descriptionBasis=factSignature(d);d.stale=false;touch(id,'descriptionReviewed');render(id);toast('已确认保留当前描述');return}if(type==='editDescription'){s.preview=false;render(id,false);jump(id,'description');$('#'+id+'-description')?.focus({preventScroll:true});return}if(type==='generate'){generate(id);return}if(type==='restore'){dRestore(id);return}if(type==='discardPending'){phoneConfirm(id,'放弃这份草稿？','这会删除之前保存在当前浏览器中的这份草稿。',()=>{s.pending=null;try{localStorage.removeItem('wellcee-v2-'+id)}catch(e){}render(id)});return}if(type==='save'){save(id,true);return}if(type==='continueDraft'){s.home=false;render(id,false);return}if(type==='startNew'){if(s.dirty){phoneConfirm(id,'重新发布一套房源？','当前草稿会被清空。',()=>{resetState(id);render(id,false)},'重新发布',()=>closeSheet(id),'保留草稿')}else{resetState(id);render(id,false)}return}if(type==='back'){if(s.success){resetState(id);s.home=true;render(id,false);return}if(s.home)return;if(s.preview){s.preview=false;d.confirmed=false;render(id,false);return}phoneConfirm(id,'是否保存本次房源信息？','草稿仅保存在当前浏览器。',()=>{save(id);if(s.saveError){toast('草稿保存失败，请减少照片后重试');return}s.home=true;render(id,false)},'保存并退出',()=>{resetState(id);s.home=true;render(id,false)},'不保存');return}if(type==='rules'){openSheet(id,'rules');return}if(type==='submit'){submit(id);return}if(type==='editPublished'){s.success=false;s.preview=id==='revised';d.confirmed=false;render(id,false);return}if(type==='new'){resetState(id);render(id,false);return}}
function errors(d){const list=[];if(!d.type)list.push(['house','请选择出租类型']);if(!d.city||!d.address)list.push(['location','请选择城市并填写小区位置']);if(!d.layoutSet)list.push(['layout','请选择户型']);if(!d.area||!Number.isFinite(+d.area)||+d.area<1||+d.area>2000)list.push(['area','请填写有效面积（1–2000m²）']);if(d.floor!==''&&(!Number.isInteger(+d.floor)||+d.floor<-3||+d.floor>150))list.push(['floor','楼层请填写-3到150之间的整数']);if(!d.rent||!Number.isFinite(+d.rent)||+d.rent<=0||+d.rent>999999)list.push(['rent','请填写有效月租金']);if(d.deposit===''||!Number.isFinite(+d.deposit)||+d.deposit<0||+d.deposit>999999)list.push(['deposit','请填写押金，无押金请填0']);if(!d.term)list.push(['terms','请选择租期']);if(!d.availableMode)list.push(['availableMode','请选择可入住时间']);if(d.availableMode==='date'&&(!d.available||d.available<today()))list.push(['available','请选择今天或之后的可入住日期']);const start=d.availableMode==='date'&&d.available?d.available:today();if(d.term==='短租'&&(!d.endDate||d.endDate<=start))list.push(['endDate','最晚退租日期需要晚于可入住时间']);if(d.term==='短租'&&d.daily!==''&&(!Number.isFinite(+d.daily)||+d.daily<=0||+d.daily>999999))list.push(['daily','请填写有效日租金，或留空']);if(d.photos.length<3)list.push(['photos','请添加至少3张房间照片']);if(d.videoNeedsReupload)list.push(['video','请重新选择视频，或选择“本次不带视频”']);return list}
function showError(id,e){toast(e[0][1]);const root=$('#'+id),box=root.querySelector('.error');box.textContent=e[0][1]+(e.length>1?'，完成后继续检查下一项。':'');box.classList.remove('hidden');const first=e[0][0],input=root.querySelector(`[data-field="${first}"] input`)||root.querySelector(`#${id}-${first}`);if(input){input.classList.add('invalid');input.scrollIntoView({block:'center',behavior:'smooth'});input.focus({preventScroll:true})}else{const el=root.querySelector(`[data-section="${first}"]`)||root.querySelector(`[data-field="${first}"]`);if(el){el.classList.add('is-invalid');el.scrollIntoView({block:'start',behavior:'smooth'})} } }
function submit(id){const s=states[id],d=s.data;const e=errors(d);if(e.length){if(s.preview){s.preview=false;render(id,false)}showError(id,e);return}if(!s.preview){s.preview=true;d.confirmed=false;render(id,false);return}if(d.stale){toast('请先核对房源描述，或修改后再发布');const note=$('#'+id+' [data-description-notice]');note?.scrollIntoView({block:'center',behavior:'smooth'});return}if(!d.confirmed){showError(id,[['confirmed','请先确认信息真实准确，并拥有出租或转租权限']]);$('#'+id+' [data-confirm]').focus();return}s.success=true;s.preview=false;s.dirty=false;try{localStorage.removeItem('wellcee-v2-'+id)}catch(e){}render(id,false)}
function resetState(id){const s=states[id];if(s.video)URL.revokeObjectURL(s.video.url);s.video=null;s.mediaBusy=false;s.data=defaultData();s.preview=false;s.success=false;s.home=false;s.dirty=false;s.pending=null;try{localStorage.removeItem('wellcee-v2-'+id)}catch(e){}}
function draftHome(id){const s=states[id],d=s.data;return `<div class="draft-home"><div class="draft-home-icon">${icon('home')}</div><h2>${s.dirty?'房源已保存为草稿':'发布你的房源'}</h2><p>${s.dirty?esc(d.address||'未命名房源')+'<br>还没填完也没关系，可以随时回来继续。':'房东直租、个人转租、找室友。'}</p><button class="entry-primary" data-action="${s.dirty?'continueDraft':'startNew'}">${s.dirty?'继续编辑':'发布房源'}</button>${s.dirty?'<button class="entry-secondary" data-action="startNew">重新发布一套</button>':''}</div>`}
function dRestore(id){const state=states[id];state.data=normalizeData(state.pending);state.mediaBusy=false;state.pending=null;state.dirty=true;state.data.videoNeedsReupload=!!state.data.videoDraftName&&!state.video;render(id,false);toast(state.data.videoNeedsReupload?'草稿已恢复，视频需要重新选择':'已恢复文字与照片') }
function generate(id){const d=states[id].data;const required=new Set(['house','location','area','rent']);const provided=new Set(['floor','deposit','available','endDate','daily']);const bad=errors(d).filter(([key])=>required.has(key)||(provided.has(key)&&d[key]!==''));if(bad.length){showError(id,bad);return}const run=()=>{const lines=[`${d.city}${d.district}，${d.address}，${d.role}${d.type==='shared'?'一个房间':'整套房屋'}。`,`${d.layoutSet?`整套户型${d.rooms}室${d.halls}厅${d.baths}卫，`:''}${d.type==='shared'?'出租房间':'整套房屋'}面积${d.area}m²${d.floor?`，位于${d.floor}层`:''}。`,''];let arrival='';if(d.availableMode==='now')arrival='随时可入住。';if(d.availableMode==='flexible')arrival='入住时间可协商。';if(d.availableMode==='date'&&d.available)arrival=d.available+'起可入住。';lines.push(`月租${d.rent}元${d.deposit!==''?`，押金${d.deposit}元`:''}。${arrival}${d.term?termText(d)+'。':''}${d.term==='短租'&&d.daily?'日租金'+d.daily+'元。':''}${d.type==='shared'&&d.roommates!==''?'现有'+d.roommates+'位室友。':''}`);if(d.facilities.length)lines.push('设施：'+d.facilities.join('、')+'。');if(d.tags.length)lines.push('房源标签：'+d.tags.join('、')+'。');d.description=lines.join(String.fromCharCode(10));d.generated=true;d.descriptionBasis=factSignature(d);d.stale=false;safelyDirty(id);render(id);toast('描述已整理，请核对后使用')};if(d.description.trim())phoneConfirm(id,'替换当前房源描述？','根据已填事实整理，替换后仍可继续编辑。',run,'替换',()=>closeSheet(id),'保留');else run()}

function safelyDirty(id){states[id].dirty=true;states[id].data.confirmed=false;save(id)}
function sheet(id,title,body,accept,okText='确认'){const root=$('#'+id);root.querySelector('.phone-overlay')?.remove();const overlay=document.createElement('div');overlay.className='phone-overlay';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="sheet-top"><button data-cancel>取消</button><strong>${esc(title)}</strong><button class="sheet-ok" data-accept>${okText}</button></div><div class="sheet-body">${body}</div></section>`;root.append(overlay);overlay.querySelector('[data-cancel]').onclick=()=>closeSheet(id);overlay.querySelector('[data-accept]').onclick=()=>{if(accept?.(overlay)!==false)closeSheet(id)};overlay.onclick=e=>{if(e.target===overlay)closeSheet(id)};trap(overlay.querySelector('.sheet'),()=>closeSheet(id));overlay.querySelector('.sheet').focus();return overlay}
function closeSheet(id){$('#'+id+' .phone-overlay')?.remove()}
function phoneConfirm(id,title,text,yes,yesText='确认',no,noText='取消'){const o=sheet(id,title,`<p>${esc(text)}</p>`,()=>{yes();return true},yesText);o.querySelector('[data-cancel]').textContent=noText;o.querySelector('[data-cancel]').onclick=()=>{if(no)no();else closeSheet(id)}}
function openSheet(id,type){const s=states[id],d=s.data;const options=(key,vals)=>`<select data-picker="${key}" aria-label="${key==='rooms'?'卧室':key==='halls'?'客厅':'卫生间'}">${vals.map(v=>`<option value="${esc(v)}" ${String(d[key])===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
if(type==='layout'){const keys=[['rooms','卧室',['1','2','3','4','5','6+']],['halls','客厅',['0','1','2','3+']],['baths','卫生间',['1','2','3','4+']]];const overlay=sheet(id,'户型',`<div class="wheel-picker">${keys.map(([key,title,values])=>`<div class="wheel-column"><strong>${title}</strong><div class="wheel-list" data-wheel-key="${key}" role="listbox" aria-label="${title}" tabindex="0" data-selected="${esc(d[key])}">${values.map(v=>`<button role="option" data-wheel-value="${v}" aria-selected="${String(d[key])===v}">${v}</button>`).join('')}</div></div>`).join('')}</div>`,o=>{keys.forEach(([key])=>d[key]=o.querySelector(`[data-wheel-key="${key}"]`).dataset.selected);d.layoutSet=true;touch(id,'layout');render(id)});setupWheels(overlay);return}
if(type==='city'){const cities=['上海','北京','深圳','广州','香港','杭州','成都','南京','苏州','武汉','重庆','西安','其他城市'];const o=sheet(id,'选择城市',`<p>热门城市</p><div class="chipset">${cities.map(v=>`<button class="chip ${d.city===v?'selected':''}" data-city="${v}">${v}</button>`).join('')}</div><label>或输入其他城市</label><input data-custom-city value="${esc(cities.includes(d.city)?'':d.city)}" placeholder="城市名称" maxlength="20">`,o=>{const v=o.querySelector('[data-custom-city]').value.trim();if(v){if(d.city!==v){d.address='';d.district=''}d.city=v;touch(id,'city');render(id)}else if(!d.city){toast('请选择或填写城市');return false}});o.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{if(b.dataset.city==='其他城市'){o.querySelector('[data-custom-city]').focus();return}if(d.city!==b.dataset.city){d.address='';d.district=''}d.city=b.dataset.city;touch(id,'city');render(id)});return}
if(type==='address'){if(!d.city){openSheet(id,'city');toast('先选择城市，再选择小区位置');return}openAddressSheet(id);return}
if(type==='minMonths'||type==='roommates'){const isMonths=type==='minMonths',vals=isMonths?['','1','3','6','12','24']:['0','1','2','3','4+'];const o=sheet(id,isMonths?'最短起租':'现有室友',`<div class="chipset">${vals.map(v=>`<button class="chip ${d[type]===v?'selected':''}" data-pick="${v}">${v===''?'可协商':v+(isMonths?'个月':'人')}</button>`).join('')}</div>`,()=>{});o.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{d[type]=b.dataset.pick;touch(id,type);render(id)});return}
if(type==='tag'){sheet(id,'房源标签',`<input data-new-tag placeholder="输入房源标签" maxlength="15" aria-label="新增房源标签"><p style="margin-top:3cqw">只添加能真实描述房源的标签。</p>`,o=>{const v=o.querySelector('[data-new-tag]').value.trim();if(!v){toast('请先填写标签');return false}if(!d.tags.includes(v))d.tags.push(v);touch(id,'tags');render(id)});return}
if(type==='avatar'){const o=sheet(id,'头像',`<p>支持 JPG、PNG、WebP 格式。</p><input type="file" data-avatar-file accept="image/jpeg,image/png,image/webp" aria-label="选择头像">`,()=>{},'完成');o.querySelector('[data-avatar-file]').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{d.avatar=await readImage(f,300);touch(id,'avatar');render(id)}catch(err){toast(err.message)}};return}
if(type==='gallery'){sheet(id,'房间照片',`<div class="gallery-grid">${d.photos.map((p,i)=>`<figure><img src="${esc(p.src)}" alt="房源照片${i+1}"><figcaption>${i===0?'封面 · ':''}${i+1} / ${d.photos.length}${p.sample?' · 样图':''}</figcaption></figure>`).join('')}</div>`,()=>{},'完成');return}
if(type==='profile'){sheet(id,'发布者资料',`<label>昵称</label><input data-profile="nickname" value="${esc(d.nickname)}" maxlength="30"><label>职业</label><input data-profile="job" value="${esc(d.job)}" placeholder="科学的讨饭方式" maxlength="40"><label>性别</label><select data-profile="gender"><option value="">暂不补充</option>${['男','女'].map(v=>`<option ${d.gender===v?'selected':''}>${v}</option>`).join('')}</select>`,o=>{if(!o.querySelector('[data-profile="nickname"]').value.trim()){toast('请填写昵称');return false}o.querySelectorAll('[data-profile]').forEach(e=>d[e.dataset.profile]=e.value);touch(id,'profile');render(id)},'保存');return}
if(type==='rules'){sheet(id,'发布须知',`<div class="publish-guidelines"><h3>发布真实、清楚的房源信息</h3><p>请使用与实际房源相符的照片，如实填写位置、租金、押金和租期。水电、物业等其他费用，可在描述中补充说明。</p><h3>确认出租或转租安排</h3><p>请确认拥有出租权限；个人转租请先与房东确认安排，避免后续沟通产生分歧。</p><h3>妥善保护个人信息</h3><p>公开房源中无需展示具体门牌、证件或私人联系方式。看房与签约细节可在后续沟通中确认。</p></div>`,()=>{},'我知道了');return}
}
async function readImage(file,max=1200){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('支持 JPG、PNG、WebP 图片');if(file.size>10*1024*1024)throw Error('单张图片请控制在10MB以内');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('图片读取失败'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('图片无法读取'));img.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function uploadPhotos(id,files){const s=states[id],d=s.data,list=Array.from(files||[]);if(!list.length)return;if(s.mediaBusy)return;if(d.photos.length+list.length>20)return toast('房间照片最多20张');s.mediaBusy=true;render(id);try{for(const f of list){if(!mediaActive(id,d))return;try{const src=await readImage(f);if(!mediaActive(id,d))return;if(d.photos.some(p=>p.src===src)){toast('相同照片不能上传第二次');continue}d.photos.push({src,name:f.name,sample:false})}catch(e){toast(e.message)}}if(mediaActive(id,d))touch(id,'photos')}finally{if(mediaActive(id,d)){s.mediaBusy=false;render(id);if(s.saveError)toast('照片已载入，但草稿保存失败，请减少照片后保存')}}}
async function uploadVideo(id,file){if(!file)return;const s=states[id],d=s.data;if(s.mediaBusy)return;if(file.size>100*1024*1024)return toast('视频请控制在100MB以内');s.mediaBusy=true;render(id);const url=URL.createObjectURL(file),video=document.createElement('video');video.preload='metadata';video.src=url;const finish=()=>{if(mediaActive(id,d)){s.mediaBusy=false;render(id)}};video.onloadedmetadata=()=>{if(!mediaActive(id,d)){URL.revokeObjectURL(url);return}if(video.duration>300||video.duration<=0||!Number.isFinite(video.duration)){URL.revokeObjectURL(url);toast('请选择300秒以内的视频');finish();return}if(s.video)URL.revokeObjectURL(s.video.url);s.video={url,name:file.name};d.videoDraftName=file.name;d.videoNeedsReupload=false;touch(id,'video');finish()};video.onerror=()=>{URL.revokeObjectURL(url);if(mediaActive(id,d)){toast('该视频无法读取，请使用MP4、MOV或WebM');finish()}}}

function trap(el,close){el.onkeydown=e=>{if(e.key==='Escape'){close();return}if(e.key==='Tab'){const all=Array.from(el.querySelectorAll('button,input,select,textarea,[tabindex="0"]')).filter(x=>!x.disabled);if(!all.length)return;if(e.shiftKey&&(document.activeElement===all[0]||document.activeElement===el)){e.preventDefault();all.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===all.at(-1)){e.preventDefault();all[0].focus()}}}}

function setupWheels(overlay){overlay.querySelectorAll('.wheel-list').forEach(list=>{const rows=Array.from(list.querySelectorAll('[data-wheel-value]'));let timer,ready=false;const rowHeight=()=>rows[0].getBoundingClientRect().height;const selectIndex=(index,scroll=false)=>{const n=Math.max(0,Math.min(rows.length-1,index));list.dataset.selected=rows[n].dataset.wheelValue;rows.forEach((r,i)=>r.setAttribute('aria-selected',String(i===n)));if(scroll)list.scrollTo({top:n*rowHeight(),behavior:'smooth'})};rows.forEach((r,i)=>r.onclick=()=>selectIndex(i,true));list.onscroll=()=>{if(!ready)return;clearTimeout(timer);timer=setTimeout(()=>selectIndex(Math.round(list.scrollTop/rowHeight())),90)};list.onkeydown=e=>{const current=rows.findIndex(r=>r.dataset.wheelValue===list.dataset.selected);if(['ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();const index=e.key==='Home'?0:e.key==='End'?rows.length-1:current+(e.key==='ArrowDown'?1:-1);selectIndex(index,true)}};requestAnimationFrame(()=>{const i=rows.findIndex(r=>r.dataset.wheelValue===list.dataset.selected);list.scrollTop=Math.max(0,i)*rowHeight();ready=true})})}
function mapArtwork(city){return `<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="640" height="480" fill="#f0f1ec"/><g fill="#e6e9e2" stroke="#fff" stroke-width="3"><path d="M0 0h130v100H0zM150 0h170v100H150zM340 0h160v100H340zM520 0h120v100H520zM0 120h130v120H0zM150 120h170v120H150zM340 120h160v120H340zM520 120h120v120H520zM0 260h130v100H0zM150 260h170v100H150zM340 260h160v100H340zM520 260h120v100H520zM0 380h130v100H0zM150 380h170v100H150zM340 380h160v100H340zM520 380h120v100H520z"/></g><path d="M-30 360C110 200 250 480 410 310S620 280 680 100" stroke="#c4e4f2" stroke-width="48" fill="none"/><path d="M-30 360C110 200 250 480 410 310S620 280 680 100" stroke="#add7ec" stroke-width="2" fill="none"/><g stroke="#e8d9a4" stroke-width="19" fill="none"><path d="M-10 95 650 382M60-20 500 500M-20 230H660"/></g><g stroke="#ffefd1" stroke-width="12" fill="none"><path d="M-10 95 650 382M60-20 500 500M-20 230H660"/></g><g stroke="#fff" stroke-width="8"><path d="M140 0V480M330 0V480M510 0V480M0 110H640M0 250H640M0 370H640"/></g><path d="M165 130h105v70H165zM365 280h110v60H365z" fill="#cfe3be"/><g font-family="sans-serif" font-size="13" fill="#999e96"><text x="177" y="168">市民公园</text><text x="370" y="312">滨水绿地</text><text x="430" y="74">城市广场</text><text x="57" y="190">地铁站</text><text x="330" y="420">${esc(city)} · 城市生活</text></g><g fill="#fff" stroke="#94b4c2"><circle cx="58" cy="170" r="8"/><circle cx="468" cy="218" r="8"/></g><text x="35" y="450" font-family="sans-serif" font-size="12" fill="#8b989b"></text></svg>`}
function openAddressSheet(id){const d=states[id].data;const html=`<div class="map-graphic"><div class="map-transform">${mapArtwork(d.city)}</div><span class="map-pin"><i></i></span><span class="map-city">${esc(d.city)}</span><span class="map-demo-badge">示意地图</span><div class="map-controls"><button type="button" data-map-zoom="in" aria-label="放大示意地图">＋</button><button type="button" data-map-zoom="out" aria-label="缩小示意地图">−</button><button type="button" data-map-reset aria-label="回到示意位置">⌖</button></div></div><div class="address-panel"><div class="panel-handle"></div><label for="${id}-sheet-address">小区 / 公寓名称</label><input id="${id}-sheet-address" data-address value="${esc(d.address)}" placeholder="请输入小区或公寓名称" maxlength="60" autocomplete="off"><div class="map-region-row"><span>${esc(d.city)}</span><input id="${id}-sheet-district" data-district value="${esc(d.district)}" placeholder="所在区域，例如徐汇区" maxlength="30" aria-label="所在区域"></div><div data-place-results></div></div><div class="map-use-footer"><button class="map-use-address" data-use-address>使用此地址</button><p>只公开小区位置，不公开具体门牌。</p></div>`;const overlay=sheet(id,'选择位置',html,o=>{const address=o.querySelector('[data-address]').value.trim(),district=o.querySelector('[data-district]').value.trim();if(!address||!district){toast('请填写小区名称和所在区域');return false}d.address=address;d.district=district;touch(id,'location');render(id)},'使用此地址');overlay.classList.add('address-overlay');overlay.querySelector('.sheet').classList.add('map-sheet');overlay.querySelector('[data-cancel]').textContent='‹ 返回';overlay.querySelector('[data-use-address]').onclick=()=>overlay.querySelector('[data-accept]').click();const query=overlay.querySelector('[data-address]'),region=overlay.querySelector('[data-district]'),results=overlay.querySelector('[data-place-results]');function showPlaces(){const value=query.value.trim(),names=value?[value]:[];results.innerHTML=names.map(name=>`<button type="button" class="place-result" data-place-name="${esc(name)}"><span><strong>${esc(name)}</strong><small>请确认小区名称与所在区域</small></span><span class="place-radio ${value===name&&region.value?'selected':''}"></span></button>`).join('');results.querySelectorAll('[data-place-name]').forEach(b=>b.onclick=()=>{query.value=b.dataset.placeName;showPlaces()})}query.oninput=showPlaces;region.oninput=showPlaces;showPlaces();const graphic=overlay.querySelector('.map-graphic'),art=overlay.querySelector('.map-transform');let zoom=1,dx=0,dy=0,drag=null;const paint=()=>art.style.transform=`translate(${dx}px,${dy}px) scale(${zoom})`;overlay.querySelectorAll('[data-map-zoom]').forEach(b=>b.onclick=()=>{zoom=Math.max(1,Math.min(2.2,zoom+(b.dataset.mapZoom==='in'?.2:-.2)));paint()});overlay.querySelector('[data-map-reset]').onclick=()=>{zoom=1;dx=dy=0;paint()};graphic.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,dx,dy};graphic.setPointerCapture(e.pointerId)};graphic.onpointermove=e=>{if(!drag)return;dx=Math.max(-70,Math.min(70,drag.dx+e.clientX-drag.x));dy=Math.max(-55,Math.min(55,drag.dy+e.clientY-drag.y));paint()};graphic.onpointerup=()=>drag=null;graphic.onpointercancel=()=>drag=null}

for(const id of ['revised'])render(id,false);
